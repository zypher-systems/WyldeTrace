<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="tealTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="#141416"/>

  <g transform="translate(25, 20)">
    <rect width="80" height="80" rx="18" fill="#2a2a2e" stroke="#3f3f46" stroke-width="2"/>
    <path d="M 16 24 L 28 58 L 40 34 L 52 58 L 64 24"
          fill="none"
          stroke="url(#tealTrace)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#softGlow)" />
    <circle cx="16" cy="24" r="3" fill="#141416" stroke="#14b8a6" stroke-width="2.5"/>
    <circle cx="40" cy="34" r="3" fill="#141416" stroke="#2dd4bf" stroke-width="2.5"/>
    <circle cx="64" cy="24" r="3.5" fill="#2dd4bf" filter="url(#softGlow)"/>
  </g>

  <g transform="translate(130, 72)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="url(#textGrad)" letter-spacing="-0.5">Wylde</text>
    <text x="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="42" fill="url(#accentGlow)" letter-spacing="0.5">Trace</text>
    <text x="2" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#71717A" letter-spacing="3.5">SYSTEM OBSERVABILITY</text>
  </g>
</svg>
