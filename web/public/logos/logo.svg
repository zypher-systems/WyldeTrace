<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="tealTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#iconBg)" stroke="#3f3f46" stroke-width="2"/>

  <path d="M 25 35 L 42 85 L 60 50 L 78 85 L 95 35"
        fill="none"
        stroke="url(#tealTrace)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)" />

  <circle cx="25" cy="35" r="4" fill="#141416" stroke="#14b8a6" stroke-width="3"/>
  <circle cx="60" cy="50" r="4" fill="#141416" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="95" cy="35" r="5" fill="#2dd4bf" filter="url(#softGlow)"/>
</svg>
