components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RangeID:
      name: rangeID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryID:
      name: deliveryID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    StatusOK:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    MFAStatus:
      type: object
      properties:
        totp_enabled: { type: boolean }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, editor, readonly] }
        location_ids:
          type: array
          items: { type: string, format: uuid }
        site_scoped: { type: boolean }
        totp_enabled: { type: boolean }
        using_default_password: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Location:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VRF:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rd: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VLAN:
      type: object
      required: [id, vid, name]
      properties:
        id: { type: string, format: uuid }
        vid: { type: integer }
        name: { type: string }
        location_id: { type: string, format: uuid, nullable: true }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeviceType:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CustomFieldDef:
      type: object
      required: [id, entity_type, key, label, field_type]
      properties:
        id: { type: string, format: uuid }
        entity_type: { type: string }
        key: { type: string }
        label: { type: string }
        field_type: { type: string, enum: [string, number, boolean, select] }
        required: { type: boolean }
        options:
          type: array
          items: { type: string }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Subnet:
      type: object
      required: [id, cidr, name, vrf_id]
      properties:
        id: { type: string, format: uuid }
        cidr: { type: string }
        name: { type: string }
        description: { type: string }
        location_id: { type: string, format: uuid, nullable: true }
        vrf_id: { type: string, format: uuid }
        vlan_id: { type: string, format: uuid, nullable: true }
        vlan_vid: { type: integer, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        tags:
          type: array
          items: { type: string }
        custom_fields:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        used: { type: integer }
        total: { type: integer }
        free: { type: integer }
        percent: { type: number }
        sparse: { type: boolean }
        next_ip: { type: string }
    IP:
      type: object
      required: [id, address, subnet_id, status]
      properties:
        id: { type: string, format: uuid }
        address: { type: string }
        subnet_id: { type: string, format: uuid }
        hostname: { type: string }
        status: { type: string, enum: [available, assigned, reserved, dhcp] }
        device_type_id: { type: string, format: uuid, nullable: true }
        location_id: { type: string, format: uuid, nullable: true }
        notes: { type: string }
        reserved_until: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        mac_address: { type: string }
        open_ports: { type: string }
        interface_name: { type: string }
        switch_id: { type: string }
        custom_fields:
          type: object
          additionalProperties: true
        vendor: { type: string }
        device_hint: { type: string }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IPRange:
      type: object
      required: [id, subnet_id, start_address, end_address]
      properties:
        id: { type: string, format: uuid }
        subnet_id: { type: string, format: uuid }
        name: { type: string }
        start_address: { type: string }
        end_address: { type: string }
        role: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IPRequest:
      type: object
      required: [id, requester_id, subnet_id, status]
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        requester_email: { type: string }
        subnet_id: { type: string, format: uuid }
        subnet_cidr: { type: string }
        subnet_name: { type: string }
        range_id: { type: string, format: uuid, nullable: true }
        hostname: { type: string }
        notes: { type: string }
        requested_address: { type: string }
        status: { type: string }
        allocated_ip_id: { type: string, format: uuid, nullable: true }
        allocated_address: { type: string }
        reviewed_by: { type: string, format: uuid, nullable: true }
        review_notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    DiscoveryJob:
      type: object
      required: [id, name, subnet_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        subnet_id: { type: string, format: uuid }
        interval_minutes: { type: integer }
        enabled: { type: boolean }
        enrich: { type: boolean }
        last_run_at: { type: string, format: date-time, nullable: true }
        last_status: { type: string }
        last_summary: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DiscoveryJobTemplate:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        interval_minutes: { type: integer }
        enrich: { type: boolean }
        enabled_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Webhook:
      type: object
      required: [id, name, url]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        secret_set: { type: boolean }
        events:
          type: array
          items: { type: string }
        format: { type: string }
        enabled: { type: boolean }
        last_status: { type: string }
        last_error: { type: string }
        last_sent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []

