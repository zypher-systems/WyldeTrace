openapi: 3.0.3
info:
  title: WyldeTrace API
  version: "1.0"
  description: |
    Hand-maintained summary of the WyldeTrace HTTP surface (`/api/v1`).
    Auth: `Authorization: Bearer <JWT|wt_…>`.
    Session JWTs expire after **24 hours** (fixed TTL). Expired/invalid tokens return **401**.
    CI: `TestOpenAPIRouteDrift` fails if chi routes and this file diverge.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Inventory
  - name: Discovery
  - name: Admin
  - name: Ops
paths:
  /api-tokens:
    get:
      tags: [Admin]
      summary: List API tokens
      responses:
        "200":
          description: Tokens
    post:
      tags: [Admin]
      summary: Create API token (shown once)
      responses:
        "201":
          description: Token + secret
  /audit-logs:
    get:
      tags: [Admin]
      summary: List audit logs
      responses:
        "200":
          description: OK
  /backup:
    get:
      tags: [Admin]
      summary: JSON backup export
      responses:
        "200":
          description: OK
  /custom-fields:
    get:
      tags: [Admin]
      summary: List custom field definitions
      responses:
        "200":
          description: Custom field definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomFieldDef"
    post:
      tags: [Admin]
      summary: Create custom field definition
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDef"
  /device-types:
    get:
      tags: [Inventory]
      summary: List device types
      responses:
        "200":
          description: Device types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceType"
    post:
      tags: [Inventory]
      summary: Create device type
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
  /discovery-jobs:
    get:
      tags: [Discovery]
      summary: List discovery jobs
      responses:
        "200":
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveryJob"
    post:
      tags: [Discovery]
      summary: Create discovery job
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryJob"
  /healthz:
    get:
      tags: [Ops]
      summary: Health check (also available at /healthz outside /api/v1)
      security: []
      responses:
        "200":
          description: OK
  /inbox:
    get:
      tags: [Discovery]
      summary: Open discovery findings
      responses:
        "200":
          description: OK
  /instance:
    get:
      tags: [Admin]
      summary: Instance diagnostics
      responses:
        "200":
          description: OK
  /ip-history:
    get:
      tags: [Inventory]
      summary: IP history timeline
      responses:
        "200":
          description: OK
  /ip-requests:
    get:
      tags: [Inventory]
      summary: List IP requests
      responses:
        "200":
          description: IP requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IPRequest"
    post:
      tags: [Inventory]
      summary: Create IP request
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPRequest"
  /ips:
    get:
      tags: [Inventory]
      summary: List IPs
      responses:
        "200":
          description: IP page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IP"
  /locations:
    get:
      tags: [Inventory]
      summary: List locations (site-scoped)
      responses:
        "200":
          description: Location list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      tags: [Inventory]
      summary: Create location (admin)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /notifications:
    get:
      tags: [Ops]
      summary: List in-app notifications
      responses:
        "200":
          description: OK
  /search:
    get:
      tags: [Inventory]
      summary: Global search (site-scoped)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
  /settings:
    get:
      tags: [Admin]
      summary: Get settings
      responses:
        "200":
          description: OK
    put:
      tags: [Admin]
      summary: Update settings
      responses:
        "200":
          description: Updated
  /subnets:
    get:
      tags: [Inventory]
      summary: List subnets (site-scoped)
      responses:
        "200":
          description: Subnet page
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subnet"
    post:
      tags: [Inventory]
      summary: Create subnet
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subnet"
  /users:
    get:
      tags: [Admin]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      tags: [Admin]
      summary: Create user
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /vlans:
    get:
      tags: [Inventory]
      summary: List VLANs
      responses:
        "200":
          description: VLAN list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VLAN"
    post:
      tags: [Inventory]
      summary: Create VLAN (editor+)
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VLAN"
  /vrfs:
    get:
      tags: [Inventory]
      summary: List VRFs
      responses:
        "200":
          description: VRF list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VRF"
    post:
      tags: [Inventory]
      summary: Create VRF
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VRF"
  /webhooks:
    get:
      tags: [Admin]
      summary: List webhooks
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      tags: [Admin]
      summary: Create webhook
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
  /api-tokens/{id}:
    delete:
      tags: [Admin]
      summary: Delete API token record
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /audit-logs/export.csv:
    get:
      tags: [Admin]
      summary: Export audit logs CSV
      responses:
        "200":
          description: OK
  /audit-logs/purge:
    post:
      tags: [Admin]
      summary: Purge audit logs
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags: [Auth]
      summary: Email/password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      tags: [Auth]
      summary: Current actor
      responses:
        "200":
          description: User profile + site scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing/invalid token
  /auth/mfa:
    get:
      tags: [Auth]
      summary: MFA enrollment status
      responses:
        "200":
          description: MFA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
  /auth/password:
    post:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOK"
  /backup/restore:
    post:
      tags: [Admin]
      summary: Merge restore
      responses:
        "200":
          description: OK
  /custom-fields/{id}:
    put:
      tags: [Admin]
      summary: Update custom field definition
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldDef"
    delete:
      tags: [Admin]
      summary: Delete custom field definition
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /device-types/{id}:
    put:
      tags: [Inventory]
      summary: Update device type
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
    delete:
      tags: [Inventory]
      summary: Delete device type
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /discovery-jobs/from-template:
    post:
      tags: [Discovery]
      summary: Create discovery job from template
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryJob"
  /discovery-jobs/templates:
    get:
      tags: [Discovery]
      summary: List discovery job templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveryJobTemplate"
    post:
      tags: [Discovery]
      summary: Create discovery job template
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryJobTemplate"
  /discovery-jobs/{id}:
    put:
      tags: [Discovery]
      summary: Update discovery job
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryJob"
    delete:
      tags: [Discovery]
      summary: Delete discovery job
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /enrich/suggest:
    get:
      tags: [Inventory]
      summary: Suggest device from OUI/ports
      responses:
        "200":
          description: OK
  /export/ips.csv:
    get:
      tags: [Inventory]
      summary: Export IPs CSV
      responses:
        "200":
          description: OK
  /export/subnets.csv:
    get:
      tags: [Inventory]
      summary: Export subnets CSV
      responses:
        "200":
          description: OK
  /import/dhcp-leases.csv:
    post:
      tags: [Inventory]
      summary: Import DHCP leases CSV
      responses:
        "200":
          description: OK
  /import/dns-hosts:
    post:
      tags: [Inventory]
      summary: Import DNS hosts file
      responses:
        "200":
          description: OK
  /import/ips.csv:
    post:
      tags: [Inventory]
      summary: Import IPs CSV
      responses:
        "200":
          description: OK
  /import/subnets.csv:
    post:
      tags: [Inventory]
      summary: Import subnets CSV
      requestBody:
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: OK
  /inbox/bulk:
    post:
      tags: [Discovery]
      summary: Bulk inbox actions
      responses:
        "200":
          description: OK
  /integrations/deliveries:
    get:
      tags: [Ops]
      summary: Integration delivery log
      responses:
        "200":
          description: OK
  /ip-requests/pending-count:
    get:
      tags: [Inventory]
      summary: Count pending IP requests
      responses:
        "200":
          description: OK
  /ip-requests/{id}:
    get:
      tags: [Inventory]
      summary: Get IP request
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: IP request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPRequest"
    delete:
      tags: [Inventory]
      summary: Delete IP request
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /ips/bulk:
    post:
      tags: [Inventory]
      summary: Bulk update IPs
      responses:
        "200":
          description: OK
  /ips/deleted:
    get:
      tags: [Inventory]
      summary: List soft-deleted IPs
      responses:
        "200":
          description: OK
  /ips/purge-deleted:
    post:
      tags: [Inventory]
      summary: Purge soft-deleted IPs
      responses:
        "200":
          description: OK
  /ips/{id}:
    put:
      tags: [Inventory]
      summary: Update IP
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IP"
    delete:
      tags: [Inventory]
      summary: Soft-delete IP
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /locations/{id}:
    get:
      tags: [Inventory]
      summary: Get location
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    put:
      tags: [Inventory]
      summary: Update location
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      tags: [Inventory]
      summary: Delete location
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /notifications/read-all:
    post:
      tags: [Ops]
      summary: Mark all notifications read
      responses:
        "204":
          description: Updated
  /reports/summary:
    get:
      tags: [Ops]
      summary: Dashboard summary JSON
      responses:
        "200":
          description: OK
  /reports/summary.csv:
    get:
      tags: [Ops]
      summary: Dashboard summary CSV
      responses:
        "200":
          description: OK
  /scanner/claim:
    post:
      tags: [Discovery]
      summary: Claim discovered host
      responses:
        "200":
          description: OK
  /scanner/discover-subnets:
    post:
      tags: [Discovery]
      summary: Probe child prefixes under supernet
      responses:
        "200":
          description: OK
  /scanner/snmp-enrich:
    post:
      tags: [Discovery]
      summary: SNMP enrich (feature-gated)
      responses:
        "200":
          description: OK
  /scanner/sweep:
    post:
      tags: [Discovery]
      summary: ICMP sweep inventory subnet
      responses:
        "200":
          description: OK
        "403":
          description: Subnet out of scope
  /subnets/bulk:
    post:
      tags: [Inventory]
      summary: Bulk update subnets
      responses:
        "200":
          description: OK
  /subnets/deleted:
    get:
      tags: [Inventory]
      summary: List soft-deleted subnets
      responses:
        "200":
          description: OK
  /subnets/purge-deleted:
    post:
      tags: [Inventory]
      summary: Purge soft-deleted subnets
      responses:
        "200":
          description: OK
  /subnets/tags:
    get:
      tags: [Inventory]
      summary: List subnet tags
      responses:
        "200":
          description: OK
  /subnets/tree:
    get:
      tags: [Inventory]
      summary: Subnet hierarchy tree
      responses:
        "200":
          description: OK
  /subnets/{id}:
    get:
      tags: [Inventory]
      summary: Get subnet
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Subnet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subnet"
    put:
      tags: [Inventory]
      summary: Update subnet
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subnet"
    delete:
      tags: [Inventory]
      summary: Soft-delete subnet
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /users/{id}:
    put:
      tags: [Admin]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      tags: [Admin]
      summary: Delete user
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /vlans/{id}:
    get:
      tags: [Inventory]
      summary: Get VLAN
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: VLAN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VLAN"
    put:
      tags: [Inventory]
      summary: Update VLAN
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VLAN"
    delete:
      tags: [Inventory]
      summary: Delete VLAN
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /vrfs/{id}:
    get:
      tags: [Inventory]
      summary: Get VRF
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: VRF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VRF"
    put:
      tags: [Inventory]
      summary: Update VRF
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VRF"
    delete:
      tags: [Inventory]
      summary: Delete VRF
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /webhooks/deliveries:
    get:
      tags: [Admin]
      summary: List webhook deliveries
      responses:
        "200":
          description: OK
  /webhooks/preview:
    post:
      tags: [Admin]
      summary: Preview webhook payload
      responses:
        "200":
          description: OK
  /webhooks/{id}:
    put:
      tags: [Admin]
      summary: Update webhook
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
    delete:
      tags: [Admin]
      summary: Delete webhook
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /api-tokens/{id}/locations:
    put:
      tags: [Admin]
      summary: Set API token locations
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
  /api-tokens/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke API token
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable MFA for current user
      responses:
        "200":
          description: OK
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete MFA login challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              properties:
                mfa_token: { type: string }
                code: { type: string }
                recovery_code: { type: string }
      responses:
        "200":
          description: OK
  /auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      security: []
      responses:
        "200":
          description: OK
  /auth/oidc/exchange:
    post:
      tags: [Auth]
      summary: Exchange one-time OIDC code for JWT
      security: []
      responses:
        "200":
          description: OK
  /auth/oidc/login:
    get:
      tags: [Auth]
      summary: Start OIDC login
      security: []
      responses:
        "200":
          description: OK
  /auth/oidc/preview:
    post:
      tags: [Auth]
      summary: Preview OIDC claim mapping (admin)
      responses:
        "200":
          description: OK
  /auth/oidc/status:
    get:
      tags: [Auth]
      summary: OIDC enabled flag
      security: []
      responses:
        "200":
          description: OK
  /backup/restore/preview:
    post:
      tags: [Admin]
      summary: Preview backup restore
      responses:
        "200":
          description: OK
  /discovery-jobs/templates/{id}:
    put:
      tags: [Discovery]
      summary: Update discovery job template
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryJobTemplate"
    delete:
      tags: [Discovery]
      summary: Delete discovery job template
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Deleted
  /discovery-jobs/{id}/run:
    post:
      tags: [Discovery]
      summary: Run job now
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
  /discovery-jobs/{id}/runs:
    get:
      tags: [Discovery]
      summary: Job run history
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: OK
  /inbox/{id}/claim:
    post:
      tags: [Discovery]
      summary: Claim finding into inventory
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
