root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/wyldetrace"
  cmd = "go build -buildvcs=false -o ./tmp/wyldetrace ./cmd/wyldetrace"
  delay = 1000
  exclude_dir = ["tmp", "web", "bin", "db/migrations"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
